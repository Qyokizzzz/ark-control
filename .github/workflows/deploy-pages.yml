name: Deploy Ark Control

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ark-control-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.server.outputs.configured }}
    steps:
      - name: Check the deployment address
        id: server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -n "$SERVER_HOST" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo '::error::Configure the SERVER_HOST repository secret before deploying.'
            exit 1
          fi

  build-agent:
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: x64
      - uses: pnpm/setup@v3
        with:
          node-version-file: false
          require-lockfile: true
          cache: true
        env:
          HUSKY: '0'
      - name: Build Windows x64 host agent
        run: pnpm run build:agent-package
      - uses: actions/upload-artifact@v4
        with:
          name: ark-control-windows-agent
          path: |
            artifacts/ArkHostAgent-Windows-x64.zip
            artifacts/ArkHostAgent-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 3

  build:
    needs: [check, build-agent]
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
          cache: true
        env:
          HUSKY: '0'
      - name: Build web application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          api_origin=$(node deploy/server-address.mjs)
          VITE_API_ORIGIN="$api_origin" pnpm --filter @ark-control/web run build --mode github-pages
      - uses: actions/download-artifact@v4
        with:
          name: ark-control-windows-agent
          path: ${{ runner.temp }}/ark-control-release/artifacts
      - name: Package management API and Windows host agent
        run: |
          release_dir="$RUNNER_TEMP/ark-control-release"
          test -s "$release_dir/artifacts/ArkHostAgent-Windows-x64.zip"
          (cd "$release_dir/artifacts" && sha256sum --check ArkHostAgent-Windows-x64.zip.sha256)
          pnpm --filter @ark-control/api run typecheck
          pnpm --filter @ark-control/api run build
          pnpm --filter @ark-control/api --prod deploy "$release_dir/apps/api"
          mkdir -p "$release_dir/apps/api/dist"
          cp -a apps/api/dist/. "$release_dir/apps/api/dist/"
          node --input-type=commonjs - "$release_dir/apps/api" <<'NODE'
          const { realpathSync } = require('node:fs');
          const { createRequire } = require('node:module');
          const { isAbsolute, join, relative, sep } = require('node:path');
          const packageDir = realpathSync(process.argv[2]);
          const from = createRequire(join(packageDir, 'package.json'));
          for (const name of Object.keys(from('./package.json').dependencies)) {
            if (name === '@ark-control/common') continue; // Included in the API bundle.
            const target = relative(packageDir, realpathSync(from.resolve(name)));
            if (isAbsolute(target) || target === '..' || target.startsWith('..' + sep)) {
              throw new Error(`Runtime dependency ${name} is outside the release`);
            }
          }
          NODE
          artifact_dir="$RUNNER_TEMP/ark-control-backend"
          mkdir -p "$artifact_dir"
          tar -czf "$artifact_dir/ark-control-backend.tar.gz" -C "$release_dir" apps artifacts
          cp deploy/publish-backend.sh deploy/rollout-backend.mjs "$artifact_dir/"
      - uses: actions/upload-artifact@v4
        with:
          name: ark-control-backend
          path: ${{ runner.temp }}/ark-control-backend
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  backend:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    environment: backend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ark-control-backend
          path: ${{ runner.temp }}/ark-control-backend
      - name: Deploy API locally and start PM2
        run: |
          artifact_dir="$RUNNER_TEMP/ark-control-backend"
          bash "$artifact_dir/publish-backend.sh" "$artifact_dir/ark-control-backend.tar.gz"
        env:
          SERVER_DEPLOY_DIR: ${{ vars.SERVER_DEPLOY_DIR }}

  deploy:
    needs: [build, backend]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish web application
        id: deployment
        uses: actions/deploy-pages@v4
