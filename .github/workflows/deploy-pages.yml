name: Deploy Ark Control

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ark-control-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      web: ${{ steps.plan.outputs.web }}
      api: ${{ steps.plan.outputs.api }}
      agent: ${{ steps.plan.outputs.agent }}
    steps:
      - name: Check the deployment address
        id: server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -n "$SERVER_HOST" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo '::error::Configure the SERVER_HOST repository secret before deploying.'
            exit 1
          fi
      - uses: actions/checkout@v6
        if: steps.server.outputs.configured == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan builds from successful deployments
        if: steps.server.outputs.configured == 'true'
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node deploy/plan-deployment.mjs
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.api == 'true' || steps.plan.outputs.agent == 'true'
        with:
          name: ark-control-deploy-scripts
          path: |
            deploy/publish-backend.sh
            deploy/rollout-backend.mjs
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  build-agent:
    needs: check
    if: needs.check.outputs.agent == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: x64
      - uses: pnpm/setup@v3
        with:
          node-version-file: false
          require-lockfile: true
          cache: true
        env:
          HUSKY: '0'
      - name: Build Windows x64 host agent
        run: pnpm run build:agent-package
      - uses: actions/upload-artifact@v4
        with:
          name: ark-control-windows-agent
          path: |
            artifacts/ArkHostAgent-Windows-x64.zip
            artifacts/ArkHostAgent-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 3

  build-web:
    needs: check
    if: needs.check.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
          cache: true
        env:
          HUSKY: '0'
      - name: Build web application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          api_origin=$(node deploy/server-address.mjs)
          VITE_API_ORIGIN="$api_origin" pnpm --filter @ark-control/web run build --mode github-pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  build-api:
    needs: [check, build-agent]
    if: >-
      !cancelled() &&
      needs.check.outputs.api == 'true' &&
      (needs.check.outputs.agent != 'true' || needs.build-agent.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
          cache: true
        env:
          HUSKY: '0'
      - uses: actions/download-artifact@v4
        if: needs.check.outputs.agent == 'true'
        with:
          name: ark-control-windows-agent
          path: ${{ runner.temp }}/ark-control-release/artifacts
      - name: Package management API
        env:
          INCLUDE_AGENT: ${{ needs.check.outputs.agent }}
        run: |
          release_dir="$RUNNER_TEMP/ark-control-release"
          sections=(apps)
          if [[ "$INCLUDE_AGENT" == true ]]; then
            test -s "$release_dir/artifacts/ArkHostAgent-Windows-x64.zip"
            (cd "$release_dir/artifacts" && sha256sum --check ArkHostAgent-Windows-x64.zip.sha256)
            sections+=(artifacts)
          fi
          pnpm --filter @ark-control/api run typecheck
          pnpm --filter @ark-control/api run build
          pnpm --filter @ark-control/api --prod deploy "$release_dir/apps/api"
          mkdir -p "$release_dir/apps/api/dist"
          cp -a apps/api/dist/. "$release_dir/apps/api/dist/"
          node --input-type=commonjs - "$release_dir/apps/api" <<'NODE'
          const { realpathSync } = require('node:fs');
          const { createRequire } = require('node:module');
          const { isAbsolute, join, relative, sep } = require('node:path');
          const packageDir = realpathSync(process.argv[2]);
          const from = createRequire(join(packageDir, 'package.json'));
          for (const name of Object.keys(from('./package.json').dependencies)) {
            if (name === '@ark-control/common') continue; // Included in the API bundle.
            const target = relative(packageDir, realpathSync(from.resolve(name)));
            if (isAbsolute(target) || target === '..' || target.startsWith('..' + sep)) {
              throw new Error(`Runtime dependency ${name} is outside the release`);
            }
          }
          NODE
          artifact_dir="$RUNNER_TEMP/ark-control-backend"
          mkdir -p "$artifact_dir"
          tar -czf "$artifact_dir/ark-control-backend.tar.gz" -C "$release_dir" "${sections[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ark-control-backend
          path: ${{ runner.temp }}/ark-control-backend/ark-control-backend.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 3

  backend:
    needs: [check, build-api, build-agent]
    if: >-
      !cancelled() &&
      (needs.check.outputs.api == 'true' || needs.check.outputs.agent == 'true') &&
      (needs.check.outputs.api != 'true' || needs.build-api.result == 'success') &&
      (needs.check.outputs.agent != 'true' || needs.build-agent.result == 'success')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    environment: backend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ark-control-deploy-scripts
          path: ${{ runner.temp }}/ark-control-${{ github.run_id }}-${{ github.run_attempt }}/scripts
      - uses: actions/download-artifact@v4
        if: needs.check.outputs.api == 'true'
        with:
          name: ark-control-backend
          path: ${{ runner.temp }}/ark-control-${{ github.run_id }}-${{ github.run_attempt }}/release
      - uses: actions/download-artifact@v4
        if: needs.check.outputs.api != 'true'
        with:
          name: ark-control-windows-agent
          path: ${{ runner.temp }}/ark-control-${{ github.run_id }}-${{ github.run_attempt }}/agent/artifacts
      - name: Deploy changed backend components locally
        run: |
          artifact_dir="$RUNNER_TEMP/ark-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          archive="$artifact_dir/release/ark-control-backend.tar.gz"
          if [[ "$ARK_DEPLOY_API" != true ]]; then
            disk_agent="$artifact_dir/agent/artifacts"
            test -s "$disk_agent/ArkHostAgent-Windows-x64.zip"
            (cd "$disk_agent" && sha256sum --check ArkHostAgent-Windows-x64.zip.sha256)
            mkdir -p "$artifact_dir/release"
            tar -czf "$archive" -C "$artifact_dir/agent" artifacts
          fi
          bash "$artifact_dir/scripts/publish-backend.sh" "$archive"
        env:
          SERVER_DEPLOY_DIR: ${{ vars.SERVER_DEPLOY_DIR }}
          ARK_DEPLOY_API: ${{ needs.check.outputs.api }}
          ARK_DEPLOY_AGENT: ${{ needs.check.outputs.agent }}

  deploy:
    needs: [check, build-web, backend]
    if: >-
      !cancelled() &&
      needs.build-web.result == 'success' &&
      (needs.backend.result == 'success' ||
        (needs.check.outputs.api == 'false' && needs.check.outputs.agent == 'false'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish web application
        id: deployment
        uses: actions/deploy-pages@v4
